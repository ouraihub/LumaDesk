[package]
name = "luma-desk"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
gpui-kit = "=0.9.0"
lumakit-ai = { path = "../LumaKit/crates/lumakit-ai" }
lumakit-gpui = { path = "../LumaKit/crates/lumakit-gpui" }
lumakit-usage-status = { path = "../LumaKit/crates/lumakit-usage-status" }
lumakit-design = { path = "../LumaKit/crates/lumakit-design" }
lumakit-support = { path = "../LumaKit/crates/lumakit-support" }
lumakit-observability = { path = "../LumaKit/crates/lumakit-observability" }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio-util = "0.7"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
futures-util = "0.3"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
